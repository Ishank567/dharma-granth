name: Deploy Cloudflare Pages

# Builds the static export in GitHub Actions and uploads it to Cloudflare
# Pages with wrangler. Setup: docs/deploy-cloudflare.md.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# without them the build still runs (and checks) but nothing is deployed.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Custom domain (dharmagranth.in) serves from the root — no base path.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://dharmagranth.in
  CLOUDFLARE_PROJECT: dharma-granth

jobs:
  build-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # Full history: the sitemap's lastmod dates come from git log.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # ~1,200 verse share images take ~6 minutes to draw; reuse them until
      # the verse text or the image template changes.
      - name: Cache verse share images
        uses: actions/cache@v4
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'public/data/scriptures-full/*.json') }}

      - name: Build static export
        # prebuild: data publish + checks + verse images.
        # postbuild: export checks, prune, Cloudflare size limits.
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=master --commit-dirty=true

      - name: Note missing secrets
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice::Built and checked, not deployed — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/deploy-cloudflare.md)."
