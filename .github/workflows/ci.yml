name: CI

# Pull requests only: pushes to master are built (with the same checks) by
# deploy-cloudflare.yml.
on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Custom domain (dharmagranth.in) serves from the root — no repo base path.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://dharmagranth.in

jobs:
  validate:
    name: Validate static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # Full history: the sitemap's lastmod dates come from git log.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Same cache as deploy-cloudflare.yml. Saved before the export so a
      # later check failure does not discard the images.
      - name: Restore verse share images
        id: og-verse
        uses: actions/cache/restore@v4
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-${{ hashFiles('public/data/scriptures-full/*.json') }}
          restore-keys: |
            og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-
            og-verse-

      - name: Shard scriptures for share images
        run: npm run shard:scriptures

      - name: Draw changed verse share images
        run: npm run og:verses

      - name: Save verse share images
        if: steps.og-verse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-${{ hashFiles('public/data/scriptures-full/*.json') }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'data/**/*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-
            nextjs-${{ runner.os }}-

      - name: Build static export
        # postbuild runs the export checks, prune and Cloudflare size limits.
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e
