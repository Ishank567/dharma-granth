name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_BASE_PATH: /dharma-granth
  NEXT_PUBLIC_SITE_URL: https://ishank567.github.io/dharma-granth

jobs:
  validate:
    name: Validate static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build GitHub Pages export
        run: npm run build:pages

      - name: Verify static export
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/_next
