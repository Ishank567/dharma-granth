name: CI

# Pull requests only: pushes to master are built (with the same checks) by
# deploy-cloudflare.yml.
on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Custom domain (dharmagranth.in) serves from the root — no repo base path.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://dharmagranth.in

jobs:
  validate:
    name: Validate static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # Full history: the sitemap's lastmod dates come from git log.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Cache verse share images
        uses: actions/cache@v4
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'public/data/scriptures-full/*.json') }}

      - name: Build static export
        # postbuild runs the export checks, prune and Cloudflare size limits.
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e
