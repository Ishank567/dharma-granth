name: Attach Custom Domain to Cloudflare Pages

on:
  push:
    paths:
      - '.github/workflows/attach-domain.yml'
  workflow_dispatch:

jobs:
  attach:
    name: Attach domain to Pages project
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare Pages Domains API
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: dharma-granth
        run: |
          for domain in "dharmagranth.in" "www.dharmagranth.in"; do
            echo "=== Attaching $domain to $PROJECT ==="
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${domain}\"}")
            
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
            CLEAN_BODY=$(echo "$BODY" | tr '\n' ' ' | tr '\r' ' ' | sed 's/  */ /g')
            echo "::error title=${domain}::Status: ${HTTP_STATUS} | ${CLEAN_BODY}"
            echo "HTTP Status: $HTTP_STATUS"
            echo "Response: $BODY"
            echo ""
          done
