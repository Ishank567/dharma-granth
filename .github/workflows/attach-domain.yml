name: Attach Custom Domain to Cloudflare Pages

on:
  push:
    paths:
      - '.github/workflows/attach-domain.yml'
  workflow_dispatch:

jobs:
  attach:
    name: Attach domain to Pages project
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare Pages Domains API
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: dharma-granth
        run: |
          echo "=== Getting Domains List ==="
          DOMAINS_RES=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
            -H "Authorization: Bearer ${API_TOKEN}")
          CLEAN_DOMAINS=$(echo "$DOMAINS_RES" | tr '\n' ' ' | tr '\r' ' ' | sed 's/  */ /g')
          echo "::notice title=Configured Domains::${CLEAN_DOMAINS}"
          echo "Domains: $DOMAINS_RES"

          for domain in "dharmagranth.in" "www.dharmagranth.in"; do
            echo "=== Retrying validation for $domain ==="
            RETRY_RES=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}/domains/${domain}" \
              -H "Authorization: Bearer ${API_TOKEN}")
            CLEAN_RETRY=$(echo "$RETRY_RES" | tr '\n' ' ' | tr '\r' ' ' | sed 's/  */ /g')
            echo "::notice title=Retry ${domain}::${CLEAN_RETRY}"
          done
